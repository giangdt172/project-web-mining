[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so-expert-rec"
version = "0.1.0"
description = "Quality-Aware Expert Recommendation on Stack Overflow via Heterogeneous Graph Mining"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2.0",
    "duckdb>=1.0.0",
    "lxml>=5.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.12.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
ltr = [
    "lightgbm>=4.3.0",
]
demo = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/so_expert_rec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
